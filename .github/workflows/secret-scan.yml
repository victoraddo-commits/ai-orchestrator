name: secret-scan

on:
  push:
  pull_request:

jobs:
  check-no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scans git-tracked files for hardcoded Telegram bot tokens / provider
      # keys. Findings are masked; exit code 1 fails the build.
      - name: Scan tracked files for hardcoded secrets
        run: python scripts/check_no_secrets.py
