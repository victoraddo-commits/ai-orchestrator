# How many ready builds advance_builds() may run at the same time (13R).
# 2026-08-03 operator directive (full parallel sweep): raised 2 -> 4.
max_concurrent_builds: 4

providers:

  claude:
    enabled: true
    command: claude
    role:
      - architecture
      - debugging
      - planning
      - system_design

  codex:
    enabled: true
    command: codex
    role:
      - coding
      - refactoring
      - testing

tools:

  docker:
    enabled: true

  proxmox:
    enabled: true
