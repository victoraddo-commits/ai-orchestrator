# How many ready builds advance_builds() may run at the same time (13R).
# 2026-08-05 operator directive: raised 4 -> 8 for Qwen4 pod (RTX PRO 6000 96GB).
# 8 concurrent requests confirmed live with 0.89-1.02s latency each.
# 2026-09-10: cloud providers removed — 100% local Ollama models (KAI MODEL TEAM).
max_concurrent_builds: 8

# Cloud providers (qwen3_coder/qwen3_pod_b RunPod, claude, codex) removed
# 2026-09-10 per operator directive — all roles now route to local Ollama
# models (kai_brain/kai_coder/kai_deep/local) via core/ai/ai_router.py.

tools:

  docker:
    enabled: true

  proxmox:
    enabled: true
