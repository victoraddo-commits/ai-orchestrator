# How many ready builds advance_builds() may run at the same time (13R).
# 2026-08-06 operator directive: raised 8 -> 16 for Qwen4 pod (RTX PRO 6000 96GB).
# 32 concurrent requests confirmed live with 0.6s avg latency, 0 failures.
# Old A100 pod (c5ib0n2adowifp) is gone — RTX PRO 6000 handles 32+ concurrent.
max_concurrent_builds: 16

providers:

  qwen3_coder:
    enabled: true
    type: vllm
    name: Qwen4
    gpu_acceleration: true
    base_url: https://ldtqgcshb2dwsw-8000.proxy.runpod.net/v1
    model: Qwen/Qwen3-32B-FP8
    role:
      - coding
      - text_task

  claude:
    enabled: true
    command: claude
    role:
      - architecture
      - debugging
      - planning
      - system_design

  codex:
    enabled: true
    command: codex
    role:
      - coding
      - refactoring
      - testing

tools:

  docker:
    enabled: true

  proxmox:
    enabled: true
