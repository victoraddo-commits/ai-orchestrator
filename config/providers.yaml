# How many ready builds advance_builds() may run at the same time (13R).
# 2026-08-05 operator directive: raised 4 -> 8 for Qwen4 pod (RTX PRO 6000 96GB).
# 8 concurrent requests confirmed live with 0.89-1.02s latency each.
max_concurrent_builds: 8

providers:

  qwen3_coder:
    enabled: true
    type: vllm
    name: Qwen4
    gpu_acceleration: true
    base_url: https://ldtqgcshb2dwsw-8000.proxy.runpod.net/v1
    model: Qwen/Qwen3-32B-FP8
    role:
      - coding
      - text_task

  claude:
    enabled: true
    command: claude
    role:
      - architecture
      - debugging
      - planning
      - system_design

  codex:
    enabled: true
    command: codex
    role:
      - coding
      - refactoring
      - testing

tools:

  docker:
    enabled: true

  proxmox:
    enabled: true
