[pytest]
testpaths = tests
markers =
    integration: exercises a real external system (Docker, etc.) instead of mocks
    external_api: integration test that specifically depends on a third-party API's uptime (Gemini/Groq/OpenRouter/etc) -- a strict subset of `integration`, always also marked integration. Excluded from the self-build deploy gate (core.roadmap_manager.SELF_TEST_ARGS) because a third party's outage has no bearing on generated-code correctness; local-only integration tests (Docker sandbox, security scanner, deployment) are deliberately NOT in this subset and keep gating deploys.
